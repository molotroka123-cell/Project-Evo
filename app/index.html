<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1420">
<title>ФРОНТИР — эволюция цивилизации</title>
<style>
  :root {
    --accent: #c9a227;
    --bg: #0d1420;
    --panel: rgba(16, 22, 34, 0.92);
    --panel-border: rgba(201, 162, 39, 0.35);
    --text: #e8e4d8;
    --dim: #9a958a;
    --good: #7de37d;
    --bad: #e37d7d;
    --warn: #e3c37d;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); overscroll-behavior: none; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); font-size: 14px; touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { position: fixed; inset: 0; touch-action: none; }

  /* ===== Верхняя полоса ресурсов ===== */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 4px;
    padding: calc(4px + var(--safe-top)) 8px 4px;
    background: linear-gradient(180deg, rgba(10,14,24,0.95), rgba(10,14,24,0.75));
    border-bottom: 1px solid var(--panel-border);
    overflow-x: auto; scrollbar-width: none; white-space: nowrap;
  }
  #topbar::-webkit-scrollbar { display: none; }
  .res { display: inline-flex; align-items: center; gap: 3px; padding: 3px 7px; background: rgba(255,255,255,0.05); border-radius: 10px; font-size: 13px; flex-shrink: 0; border: 1px solid transparent; }
  .res small { color: var(--dim); font-size: 10px; }
  /* Прирост за игровой день. Числу нужен собственный вес: игрок читает
     сначала знак и цвет, и только потом само значение. */
  .res .rate { font-style: normal; font-size: 10px; font-weight: 700; margin-left: 1px; letter-spacing: -0.2px; }
  .res .rate.up { color: var(--good); }
  .res .rate.dn { color: var(--bad); }
  .res .rate.zero { color: var(--dim); }
  .res.res-warn { border-color: rgba(227,195,125,0.55); background: rgba(227,195,125,0.12); }
  .res.res-bad { border-color: rgba(227,125,125,0.7); background: rgba(227,125,125,0.16); animation: resPulse 1.8s ease-in-out infinite; }
  @keyframes resPulse { 50% { background: rgba(227,125,125,0.32); } }
  #topbar [data-tipk] { cursor: help; }
  #eraBadge {
    flex-shrink: 0; padding: 3px 10px; border-radius: 10px; font-weight: 600; font-size: 12px;
    background: linear-gradient(135deg, rgba(201,162,39,0.3), rgba(201,162,39,0.1));
    border: 1px solid var(--accent); cursor: pointer;
  }
  #dateBox { flex-shrink: 0; color: var(--dim); font-size: 11px; padding: 0 6px; }

  /* ===== Кнопки времени ===== */
  #timeBox {
    position: fixed; top: calc(46px + var(--safe-top)); right: 8px; z-index: 20;
    display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 20px; padding: 3px;
  }
  #timeBox button {
    width: 40px; height: 32px; border: none; background: transparent; color: var(--text);
    font-size: 14px; border-radius: 16px; cursor: pointer;
  }
  #timeBox button.active { background: var(--accent); color: #14100a; font-weight: 700; }
  #btnMenu { width: 40px; }

  /* ===== Строка причин (что именно не так прямо сейчас) ===== */
  /* Красная цифра в шапке говорит «плохо», но не говорит «почему». Здесь —
     короткая причина: зима, нет рук, склад полон. Не перехватывает клики:
     это подпись к карте, а не панель. */
  #alerts {
    position: fixed; top: calc(46px + var(--safe-top)); left: 8px; z-index: 19;
    display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    max-width: min(52vw, 460px);
  }
  #alerts.hide { display: none; }
  .alert {
    font-size: 11px; line-height: 1.35; padding: 4px 9px; border-radius: 8px;
    background: rgba(12,17,27,0.9); border: 1px solid var(--panel-border);
    border-left: 3px solid var(--warn); color: var(--text);
  }
  .alert.bad { border-left-color: var(--bad); }
  .alert.info { border-left-color: var(--accent); }
  .alert b { color: var(--warn); font-weight: 600; }
  .alert.bad b { color: var(--bad); }

  /* ===== Всплывающая подсказка ===== */
  #tip {
    position: fixed; z-index: 80; display: none; width: max-content; max-width: 300px;
    background: rgba(10,15,24,0.97); border: 1px solid var(--panel-border);
    border-radius: 10px; padding: 9px 11px; font-size: 12px; line-height: 1.45;
    box-shadow: 0 12px 34px rgba(0,0,0,0.6); pointer-events: none;
  }
  #tip.show { display: block; }
  #tip h5 { color: var(--accent); font-size: 12px; margin-bottom: 5px; }
  #tip .t-row { display: flex; justify-content: space-between; gap: 14px; color: var(--dim); }
  #tip .t-row b { color: var(--text); font-weight: 600; }
  #tip .t-sep { height: 1px; background: rgba(255,255,255,0.08); margin: 5px 0; }
  #tip .t-bad { color: var(--bad); margin-top: 4px; }
  #tip .t-good { color: var(--good); margin-top: 4px; }
  #tip .t-note { color: var(--dim); margin-top: 4px; font-size: 11px; }

  /* ===== Вкладки внутри модалки (меню) ===== */
  .mtabs { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 1px solid var(--panel-border); }
  .mtabs button {
    flex: 1; padding: 9px 6px; background: transparent; border: none; color: var(--dim);
    font-size: 12px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .mtabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .qopt { display: block; text-align: left; }
  .qopt small { display: block; color: var(--dim); font-size: 11px; font-weight: 400; margin-top: 2px; }
  .btn.primary .qopt small, .btn.primary small { color: rgba(20,16,10,0.75); }

  /* ===== Тосты ===== */
  #toasts { position: fixed; top: calc(88px + var(--safe-top)); left: 50%; transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; gap: 6px; pointer-events: none; width: min(92vw, 480px); }
  .toast { background: var(--panel); border: 1px solid var(--panel-border); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 8px; font-size: 13px; animation: toastIn 0.25s ease-out; text-align: center; }
  .toast.warn { border-left-color: var(--warn); }
  .toast.bad { border-left-color: var(--bad); }
  .toast.good { border-left-color: var(--good); }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; } }

  /* ===== Боковая панель (ПК) ===== */
  #sidePanel {
    position: fixed; top: calc(88px + var(--safe-top)); right: 8px; bottom: 12px; z-index: 15;
    width: 320px; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--panel-border); border-radius: 12px; overflow: hidden;
  }
  #sideTabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--panel-border); }
  #sideTabs button {
    flex: 1 1 30%; padding: 10px 4px; background: transparent; border: none; color: var(--dim);
    font-size: 11px; font-weight: 600; cursor: pointer; letter-spacing: 0.4px; border-bottom: 2px solid transparent;
  }
  #sideTabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  #sideContent { flex: 1; overflow-y: auto; padding: 8px; -webkit-overflow-scrolling: touch; }

  /* ===== Нижний шит (телефон) ===== */
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
    background: var(--panel); border-top: 1px solid var(--panel-border);
    border-radius: 16px 16px 0 0; display: none; flex-direction: column;
    height: calc(56px + var(--safe-bottom)); transition: height 0.25s ease-out;
  }
  #sheet.open { height: 55vh; }
  #sheetHandle { padding: 6px; text-align: center; cursor: pointer; flex-shrink: 0; }
  #sheetHandle::before { content: ''; display: inline-block; width: 40px; height: 4px; border-radius: 2px; background: var(--dim); }
  #sheetTabs { display: flex; border-top: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; padding-bottom: var(--safe-bottom); }
  #sheetTabs button { flex: 1; min-height: 44px; background: transparent; border: none; color: var(--dim); font-size: 10px; font-weight: 600; cursor: pointer; }
  #sheetTabs button.active { color: var(--accent); }
  #sheetTabs button .ic { display: block; font-size: 16px; margin-bottom: 1px; }
  #sheetContent { flex: 1; overflow-y: auto; padding: 8px 10px calc(10px + var(--safe-bottom)); display: none; -webkit-overflow-scrolling: touch; }
  #sheet.open #sheetContent { display: block; }
  #sheet.open #sheetTabs { order: -1; }

  /* ===== Карточки ===== */
  .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
  .card:active, .card:hover { border-color: var(--accent); }
  .card.disabled { opacity: 0.45; }
  .card .ttl { font-weight: 600; font-size: 13px; display: flex; justify-content: space-between; }
  .card .cost { color: var(--warn); font-size: 11px; }
  .card .desc { color: var(--dim); font-size: 11px; margin-top: 3px; line-height: 1.35; }
  .card .reason { color: var(--bad); font-size: 11px; margin-top: 3px; }
  .card.done-card { border-color: var(--good); opacity: 0.6; }
  h4.group { color: var(--accent); font-size: 11px; letter-spacing: 1px; margin: 12px 0 6px; text-transform: uppercase; }

  /* ===== Цели и журнал ===== */
  .obj { display: flex; gap: 8px; padding: 6px 4px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .obj .mark { color: var(--dim); }
  .obj.done { color: var(--dim); text-decoration: line-through; }
  .obj.done .mark { color: var(--good); }
  .obj.current { color: var(--accent); font-weight: 600; }
  #logList { font-size: 11px; line-height: 1.5; }
  #logList .l-day { color: var(--dim); }
  #logList .l-good { color: var(--good); }
  #logList .l-bad { color: var(--bad); }
  #logList .l-warn { color: var(--warn); }

  /* ===== Кнопки действий стройки на карте ===== */
  #placeBar { position: fixed; bottom: calc(70px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); z-index: 30; display: none; gap: 10px; }
  #placeBar.show { display: flex; }
  #placeBar button { width: 56px; height: 56px; border-radius: 50%; border: 2px solid; font-size: 24px; cursor: pointer; background: var(--panel); }
  #placeOk { border-color: var(--good); color: var(--good); }
  #placeCancel { border-color: var(--bad); color: var(--bad); }

  /* ===== Модалки ===== */
  /* Выше стартового экрана (60): «Новая игра» открывает модалку выбора соседей
     прямо с заставки, и при 50 она оказывалась ПОД непрозрачной заставкой —
     клик «ничего не делал». Победа (55) и баннер эпохи (45) с модалкой
     одновременно не живут, им порядок не важен. */
  .modal-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(5,8,14,0.7); display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-wrap.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px; padding: 18px; width: min(94vw, 440px); max-height: 80vh; overflow-y: auto; }
  .modal h3 { color: var(--accent); margin-bottom: 10px; font-size: 16px; }
  .modal p { font-size: 13px; line-height: 1.5; margin-bottom: 12px; color: var(--text); }
  .modal .btns { display: flex; flex-direction: column; gap: 8px; }
  .btn { padding: 12px 16px; min-height: 44px; border-radius: 10px; border: 1px solid var(--panel-border); background: rgba(201,162,39,0.15); color: var(--text); font-size: 14px; cursor: pointer; text-align: center; }
  .btn:active { background: rgba(201,162,39,0.35); }
  .btn.primary { background: var(--accent); color: #14100a; font-weight: 700; border: none; }
  .btn.danger { border-color: var(--bad); color: var(--bad); background: rgba(227,125,125,0.1); }
  .btn:disabled { opacity: 0.4; }

  /* ===== Стартовый экран ===== */
  #overlay { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 30%, #1d2a44 0%, #0d1420 70%); text-align: center; padding: 20px; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: clamp(38px, 9vw, 72px); letter-spacing: 8px; color: var(--accent); text-shadow: 0 0 40px rgba(201,162,39,0.4); margin-bottom: 6px; }
  #overlay .sub { color: var(--dim); margin-bottom: 30px; font-size: 14px; }
  #overlay .btns { display: flex; flex-direction: column; gap: 10px; width: min(80vw, 300px); }
  #overlay .art { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.35; z-index: -1; }
  #overlay .credits { position: absolute; bottom: calc(12px + var(--safe-bottom)); color: var(--dim); font-size: 11px; }

  /* ===== Баннер эпохи ===== */
  #eraBanner { position: fixed; inset: 0; z-index: 45; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #eraBanner.show { display: flex; animation: eraIn 3.5s ease-out forwards; }
  #eraBanner .inner { text-align: center; background: rgba(10,14,24,0.85); padding: 30px 50px; border-radius: 16px; border: 1px solid var(--accent); }
  #eraBanner h2 { color: var(--accent); font-size: clamp(26px, 6vw, 44px); letter-spacing: 4px; }
  #eraBanner .years { color: var(--dim); font-size: 15px; margin-top: 6px; }
  @keyframes eraIn { 0% { opacity: 0; transform: scale(0.9); } 12% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

  /* ===== Победа ===== */
  #victory { position: fixed; inset: 0; z-index: 55; display: none; flex-direction: column; align-items: center; background: radial-gradient(ellipse at 50% 20%, #14324a 0%, #05080e 75%); overflow-y: auto; padding: 40px 20px calc(20px + var(--safe-bottom)); text-align: center; }
  #victory.show { display: flex; }
  #victoryArt { width: min(88vw, 640px); aspect-ratio: 3/2; background-size: cover; background-position: center; border-radius: 16px; border: 1px solid rgba(125,227,255,0.35); box-shadow: 0 12px 60px rgba(0,0,0,0.6), 0 0 50px rgba(125,227,255,0.15); margin-bottom: 14px; }
  #victory h1 { color: #7de3ff; font-size: clamp(28px, 7vw, 52px); letter-spacing: 4px; text-shadow: 0 0 40px rgba(125,227,255,0.5); }
  #victory .beam { width: 4px; height: 120px; margin: 10px auto; background: linear-gradient(0deg, rgba(125,227,255,0.9), transparent); animation: beamPulse 2s infinite; }
  @keyframes beamPulse { 50% { opacity: 0.4; } }
  #victory .chron { max-width: 520px; text-align: left; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 14px; margin: 16px 0; font-size: 12px; line-height: 1.7; max-height: 40vh; overflow-y: auto; }
  #victory .stats { color: var(--dim); font-size: 13px; margin-bottom: 14px; }

  /* ===== Консоль ===== */
  #consoleBox { position: fixed; left: 8px; bottom: calc(8px + var(--safe-bottom)); z-index: 35; width: min(92vw, 420px); display: none; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 10px; overflow: hidden; }
  #consoleBox.show { display: block; }
  #consoleOut { max-height: 160px; overflow-y: auto; padding: 8px; font: 11px/1.5 monospace; white-space: pre-wrap; color: var(--dim); }
  #consoleIn { width: 100%; border: none; border-top: 1px solid var(--panel-border); background: rgba(0,0,0,0.3); color: var(--text); padding: 10px; font: 13px monospace; outline: none; }

  /* ===== Карточка здания / фракции ===== */
  .kv { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .kv span:last-child { color: var(--accent); }
  .relbar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; margin: 6px 0; }
  .relbar > div { height: 100%; border-radius: 4px; }

  /* ===== Онбординг ===== */
  #coach { position: fixed; z-index: 48; display: none; max-width: 260px; background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 12px; font-size: 13px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  #coach.show { display: block; }
  #coach .btns { display: flex; gap: 8px; margin-top: 10px; }
  #coach .btn { padding: 8px 12px; min-height: 36px; font-size: 12px; }

  /* ===== Адаптив: телефон ===== */
  @media (max-width: 820px) {
    #sidePanel { display: none; }
    #sheet { display: flex; }
    #timeBox { top: calc(44px + var(--safe-top)); }
    .res { font-size: 12px; padding: 3px 6px; }
    #consoleBox { bottom: calc(64px + var(--safe-bottom)); }
    /* Сверху на телефоне место занято кнопками времени (246 px из 390),
       поэтому причины уезжают вниз — над нижним листом, где пусто. */
    /* 142 px справа — ширина мини-карты (120 + рамка и отступ): текст причин
       не должен её закрывать. */
    #alerts { top: auto; bottom: calc(62px + var(--safe-bottom)); left: 8px; right: 142px; max-width: none; }
    #tip { display: none !important; }
    /* Шапка на телефоне и без того не помещается — словесные пояснения
       остаются только на большом экране, цифры видны всегда. */
    .res .wide { display: none; }
  }
  @media (min-width: 821px) {
    #placeBar { bottom: 24px; }
  }

/* Летопись: сила памяти полосой, чтобы «помнят» имело величину, а не только
   название. Ширина полосы считается от силы следа, потолок породы — 2.0. */
.mem-row { padding:8px 10px; margin:6px 0; background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07); border-radius:8px; }
.mem-head { display:flex; justify-content:space-between; align-items:baseline; font-size:13px; }
.mem-bar { height:5px; margin:6px 0 5px; background:rgba(255,255,255,.09); border-radius:3px; overflow:hidden; }
.mem-bar i { display:block; height:100%; border-radius:3px; }
.mem-txt { font-size:12px; line-height:1.45; color:var(--dim); }
.mem-eff { font-size:12px; margin:8px 2px 2px; }
#chronList { font-size:12px; line-height:1.6; max-height:38vh; overflow-y:auto; }
.ghost-svg { width:100%; height:54px; display:block; margin:6px 0 8px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topbar">
  <span class="res" id="rFood" data-tipk="r:food">🍞 <b>0</b><small>/200</small></span>
  <span class="res" id="rFoodDays" data-tipk="days:food">⏳ <b>—</b></span>
  <span class="res" id="rWood" data-tipk="r:wood">🪵 <b>0</b></span>
  <span class="res" id="rStone" data-tipk="r:stone">🪨 <b>0</b></span>
  <span class="res" id="rSteel" data-tipk="r:steel">⚙️ <b>0</b></span>
  <span class="res" id="rGold" data-tipk="r:gold">🪙 <b>0</b></span>
  <span class="res" id="rKnow" data-tipk="r:knowledge">📜 <b>0</b></span>
  <span class="res" id="rPop" data-tipk="pop:0">👥 <b>0</b><small>/6</small></span>
  <span class="res" id="rIdle" data-tipk="idle:0">🧍 <b>0</b><small> без дела</small></span>
  <span class="res" id="rHappy" data-tipk="happy:0">😊 <b>50%</b></span>
  <span id="eraBadge">Каменный век</span>
  <span id="dateBox">День 1</span>
</div>

<div id="alerts"></div>
<div id="tip"></div>

<div id="timeBox">
  <button id="btnPause" title="Пауза (Space)">⏸</button>
  <button data-speed="1" class="active" title="Скорость 1">▶</button>
  <button data-speed="2" title="Скорость 2">▶▶</button>
  <button data-speed="8" title="Скорость 8">▶▶▶</button>
  <button id="btnSound" title="Звук">🔊</button>
  <button id="btnMenu" title="Меню (Esc)">☰</button>
</div>

<div id="toasts"></div>

<div id="sidePanel">
  <div id="sideTabs"></div>
  <div id="sideContent"></div>
</div>

<div id="sheet">
  <div id="sheetHandle"></div>
  <div id="sheetContent"></div>
  <div id="sheetTabs"></div>
</div>

<div id="placeBar">
  <button id="placeCancel" title="Отмена">✗</button>
  <button id="placeOk" title="Поставить">✓</button>
</div>

<div id="consoleBox">
  <div id="consoleOut"></div>
  <input id="consoleIn" placeholder="Команда… (help — справка)" autocomplete="off">
</div>

<div class="modal-wrap" id="modalWrap"><div class="modal" id="modalBox"></div></div>

<div id="eraBanner"><div class="inner"><h2 id="eraName"></h2><div class="years" id="eraYears"></div></div></div>

<div id="victory">
  <div id="victoryArt"></div>
